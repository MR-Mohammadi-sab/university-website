
<!-- FILE: teacher-grade-entry.html (STATIC VERSION - NO JS) -->
<!DOCTYPE html>
<html lang="prs" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود نمرات استاد</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>

  <div class="app-wrapper">


    <aside class="sidebar">
      <div class="logo-area">
        <i class="fas fa-landmark"></i>
        <span>استاد</span>
      </div>

      <nav class="nav-menu">
        <a href="teacher-dashboard.html" class="nav-item">داشبورد</a>
        <a href="teacher-courses.html" class="nav-item">دوره‌های من</a>
        <a href="teacher-grade-entry.html" class="nav-item active">ورود نمرات</a>
        <a href="teacher-students.html" class="nav-item">محصلان من</a>
      </nav>

      <footer class="sidebar-footer">
        <a href="../index.html" >خروج</a>
      </footer>

    </aside>

    <main class="main-panel">

      <!-- TOP BAR -->
      <header class="top-bar">
        <div class="user-greeting">
          <i class="fas fa-edit"></i>
          <span>ورود نمرات - استاد احمدی</span>
        </div>

      </header>

      <!-- CONTENT -->
      <div class="page-content">

        <section class="card">

          <div class="card-header">
            <i class="fas fa-pen-fancy"></i>
            ورود / ویرایش نمرات محصلان
          </div>

          <!-- COURSE SELECT (STATIC) -->
          <div class="form-row">
            <label>انتخاب دوره</label>
            <select>
              <option>برنامه‌سازی وب (CS401)</option>
              <option>ساختمان داده (CS302)</option>
            </select>
          </div>

          <!-- TABLE -->
          <div class="table">
            <table class="data-table">

              <thead>
                <tr>
                  <th>آیدی محصل</th>
                  <th>نام محصل</th>
                  <th>نمره فعلی</th>
                  <th>نمره جدید</th>
                  <th>وضعیت</th>
                </tr>
              </thead>

              <tbody>

                <!-- STUDENT 1 -->
                <tr>
                  <td>UMS1</td>
                  <td>فاطمه احمدی</td>
                  <td>۷۵</td>
                  <td>
                    <input type="number" value="75" min="0" max="100">
                  </td>
                  <td class="status-active">ثبت شده</td>
                </tr>

                <!-- STUDENT 2 -->
                <tr>
                  <td>UMS2</td>
                  <td>رامین رحیمی</td>
                  <td>۶۸</td>
                  <td>
                    <input type="number" value="68" min="0" max="100">
                  </td>
                  <td class="status-active">ثبت شده</td>
                </tr>

                <!-- STUDENT 3 -->
                <tr>
                  <td>UMS3</td>
                  <td>نسیمه کریمی</td>
                  <td>۸۲</td>
                  <td>
                    <input type="number" value="82" min="0" max="100">
                  </td>
                  <td class="status-active">ثبت شده</td>
                </tr>

                <!-- STUDENT 4 -->
                <tr>
                  <td>UMS4</td>
                  <td>علی موسوی</td>
                  <td>۴۵</td>
                  <td>
                    <input type="number" value="45" min="0" max="100">
                  </td>
                  <td class="warning-text">اخطار</td>
                </tr>

                <!-- STUDENT 5 -->
                <tr>
                  <td>UMS5</td>
                  <td>سارا حسینی</td>
                  <td>۸۸</td>
                  <td>
                    <input type="number" value="88" min="0" max="100">
                  </td>
                  <td class="status-active">ثبت شده</td>
                </tr>

              </tbody>

            </table>
          </div>

          <button class="btn-primary">
            ثبت همه نمرات
          </button>

        </section>

      </div>
    </main>

  </div>

</body>
</html>
