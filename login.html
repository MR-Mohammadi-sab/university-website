<!-- FILE: login.html -->
<!DOCTYPE html>
<html lang="prs" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سیستم</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      color: white;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-header i {
      font-size: 40px;
      color: #60a5fa;
      margin-bottom: 10px;
    }

    .auth-header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .auth-header p {
      font-size: 13px;
      opacity: 0.7;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .input-group i {
      margin-left: 10px;
      color: #93c5fd;
    }

    .input-group input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .footer-text {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.7;
    }

  </style>
</head>

<body>

  <div class="auth-container">
    <div class="auth-card">

      <!-- HEADER -->
      <div class="auth-header">
        <i class="fas fa-landmark"></i>
        <p> ورود امن</p>
      </div>

      <!-- FORM -->
      <form action="./index.html">

        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" placeholder="ایمیل / نام کاربری" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="رمز عبور" required>
        </div>

        <button type="submit" class="btn-primary">
            ورود
          <i class="fas fa-arrow-left"></i>
        </button>

      </form>

      <div class="footer-text">
        © UMS - University Management System
      </div>

    </div>
  </div>

</body>
</html>
