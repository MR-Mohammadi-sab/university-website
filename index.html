<!-- FILE: index.html (Landing Page - Role Selection) -->
<!DOCTYPE html>
<html lang="prs" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMS | سیستم مدیریت تحصیلی</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="landing-body">
  <div class="landing-container">
    <div class="landing-header">
      <i class="fas fa-landmark"></i>
      <h1>سیستم مدیریت تحصیلی</h1>
    </div>
    <div class="role-cards">
      <a href="./admin/admin-dashboard.html" class="role-card">
        <i class="fas fa-user-shield"></i>
        <h2>مدیر سیستم</h2>
        <p>مدیریت کامل محصلان، اساتید، دوره‌ها، نمرات و گزارشات</p>
        <span class="role-badge">Admin Access</span>
      </a>
      <a href="./teacher/teacher-dashboard.html" class="role-card">
        <i class="fas fa-chalkboard-user"></i>
        <h2>استاد</h2>
        <p>ورود نمرات، مشاهده محصلان دوره‌های خود، ویرایش نمرات</p>
        <span class="role-badge">Teacher Access</span>
      </a>
      <a href="./students/student-dashboard.html" class="role-card">
        <i class="fas fa-user-graduate"></i>
        <h2>محصل</h2>
        <p>مشاهده نمرات، اطلاعات شخصی، وضعیت تحصیلی و پیشرفت</p>
        <span class="role-badge">Student Access</span>
      </a>
    </div>
  </div>
</body>
</html>
